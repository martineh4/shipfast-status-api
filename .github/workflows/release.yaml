# Runs when application code lands on main:
#   1. build the image and push it to GHCR, tagged with the commit SHA
#   2. open a pull request that bumps the dev overlay to that tag
# Merging that PR is the deployment: Argo CD sees the new commit on main and
# rolls it out. Nothing here touches the cluster.
name: release

on:
  push:
    branches: [main]
    paths:
      - app/**
      - Dockerfile
      - .dockerignore
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-push-and-propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compute tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Open deploy PR for dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          branch="deploy/dev-${TAG}"
          sed -i -E "s/^(\s*newTag:).*/\1 ${TAG}/" deploy/overlays/dev/kustomization.yaml
          if git diff --quiet; then echo "dev already at ${TAG}"; exit 0; fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "deploy(dev): status-api ${TAG}"
          git push --force origin "$branch"

          {
            echo "Promotes \`${IMAGE}:${TAG}\` to **dev**."
            echo
            echo "- Built from: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "- Release run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "Merging this PR **is** the deployment: Argo CD syncs \`deploy/overlays/dev\` from \`main\`."
          } > pr-body.md
          gh pr create --base main --head "$branch" \
            --title "deploy(dev): status-api ${TAG}" --body-file pr-body.md \
            || echo "PR for ${branch} already exists"

          # PRs opened with GITHUB_TOKEN don't fire pull_request; dispatch the required checks.
          gh workflow run ci.yaml --ref "$branch"
